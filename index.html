
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MBI Symposium 2026</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 12px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f5f8;
      color: #ffffff;
    }

    .conference-card {
      max-width: 700px;
      margin: 0 auto;
      overflow: hidden;
      background: #12344d;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .header {
      padding: 35px 20px 20px;
      background: #12344d;
    }

    .logo {
      display: block;
      width: 280px;
      max-width: 90%;
      height: auto;
      margin: 0 auto 22px;
      background: #ffffff;
      padding: 10px;
      border-radius: 8px;
    }

    h1 {
      font-size: 32px;
      margin: 10px 0;
      color: #ffffff;
    }

    .subtitle {
      font-size: 19px;
      margin: 10px 0;
      color: #e1eaf0;
    }

    .details {
      margin-top: 22px;
      line-height: 2;
      font-size: 16px;
      color: #ffffff;
    }

    .program {
      padding: 20px 25px 40px;
      background: #12344d;
    }

    .program h2 {
      font-size: 26px;
      margin: 8px 0 18px;
      color: #ffffff;
    }

    .welcome {
      max-width: 520px;
      margin: 0 auto 32px;
      line-height: 1.8;
      color: #e1eaf0;
      font-size: 18px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 18px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 260px;
      min-height: 75px;
      padding: 22px 30px;
      background: #ffffff;
      color: #12344d;
      text-decoration: none;
      border-radius: 10px;
      font-size: 21px;
      font-weight: bold;
      transition: background 0.2s, transform 0.2s;
    }

    .button:hover {
      background: #dce9f2;
      transform: translateY(-2px);
    }

    footer {
      text-align: center;
      padding: 20px 10px;
      color: #667788;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px 8px;
      }

      .conference-card {
        border-radius: 12px;
      }

      .header {
        padding: 25px 15px 15px;
      }

      .logo {
        width: 250px;
      }

      h1 {
        font-size: 26px;
      }

      .subtitle {
        font-size: 17px;
      }

      .details {
        font-size: 15px;
      }

      .program {
        padding: 20px 18px 30px;
      }

      .program h2 {
        font-size: 23px;
      }

      .welcome {
        font-size: 16px;
        margin-bottom: 26px;
      }

      .buttons {
        flex-direction: column;
        gap: 14px;
      }

      .button {
        width: 100%;
        min-width: 0;
        min-height: 70px;
        padding: 20px;
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="conference-card">

    <header class="header">

      <img
        src="mbi-logo.jpg.jpg"
        alt="MBI Symposium Logo"
        class="logo"
      >

      <h1>MBI Symposium 2026</h1>

      <div class="subtitle">
        Mind-Body Interface Symposium
      </div>

      <div class="details">
        <div>📅 November 14–16, 2026</div>
        <div>📍 Taichung, Taiwan</div>
      </div>

    </header>

    <section class="program">

      <h2>Conference Program</h2>

      <p class="welcome">
        Choose the version best suited to your device.
      </p>

      <div class="buttons">

        <a
          class="button"
          href="conference.pdf"
          target="_blank"
          rel="noopener"
        >
          📱 Mobile
        </a>

        <a
          class="button"
          href="conference.pdf"
          target="_blank"
          rel="noopener"
        >
          💻 Laptop
        </a>

      </div>

    </section>

  </main>

  <footer>
    MBI Symposium 2026 · Taichung, Taiwan
  </footer>

</body>
</html>
